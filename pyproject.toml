[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conway-game-of-life"
version = "0.1.0"
description = "Conway's Game of Life with pygame visualization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pygame-ce>=2.5.7",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "pylint>=2.17.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/game"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
